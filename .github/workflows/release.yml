name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build web assets
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          Copy-Item src/index.html ../crates/ttying-core/assets/index.html -Force
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows binary
        run: |
          cargo build --locked --release --target x86_64-pc-windows-gnu -p ttying-cli
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/ttying.exe dist/ttying-windows-x86_64.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ttying-windows-x86_64
          path: dist/ttying-windows-x86_64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build web assets
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp src/index.html ../crates/ttying-core/assets/index.html
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Linux binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl -p ttying-cli
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ttying dist/ttying-linux-x86_64
          chmod +x dist/ttying-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: ttying-linux-x86_64
          path: dist/ttying-linux-x86_64
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build web assets
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp src/index.html ../crates/ttying-core/assets/index.html
      - name: Build macOS arm64 binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --locked --release --target aarch64-apple-darwin -p ttying-cli
          mkdir -p dist/package
          cp target/aarch64-apple-darwin/release/ttying dist/package/ttying
          chmod +x dist/package/ttying
      - name: Verify and package
        run: |
          file dist/package/ttying
          # Ad-hoc signature: required on Apple silicon and invalidated by any
          # post-link modification. This does not grant Gatekeeper trust.
          codesign --force --sign - dist/package/ttying
          codesign --verify --strict --verbose=2 dist/package/ttying
          dist/package/ttying --version
          cp ttying.ini.example LICENSE README.md README.en-US.md dist/package/
          tar -czf dist/ttying-macos-arm64.tar.gz -C dist/package \
            ttying ttying.ini.example LICENSE README.md README.en-US.md
          tar -tzf dist/ttying-macos-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ttying-macos-arm64
          path: dist/ttying-macos-arm64.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build web assets
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp src/index.html ../crates/ttying-core/assets/index.html
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Select Android SDK and NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ttying.keystore"
          chmod 600 "$RUNNER_TEMP/ttying.keystore"
          echo "TTYING_ANDROID_KEYSTORE=$RUNNER_TEMP/ttying.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          TTYING_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TTYING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TTYING_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/build-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: ttying-android-arm64
          path: dist/ttying-android-arm64.apk
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ttying-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          rm -f *.sha256
          sha256sum ttying-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ttying ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ttying-windows-x86_64.exe
            dist/ttying-linux-x86_64
            dist/ttying-macos-arm64.tar.gz
            dist/ttying-android-arm64.apk
            dist/SHA256SUMS.txt
